[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsketch"
version = "0.1.0"
description = "Benchmark of vector compression schemes by how well they preserve inner products"
readme = "README.md"
authors = [{ name = "Mitesh Patel" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "numba>=0.58", "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["ipsketch"]
